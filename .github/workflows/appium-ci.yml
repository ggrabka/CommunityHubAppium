name: Appium CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  appium-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: checkOut Appium repository
        uses: actions/checkout@v4
      - name: Checkout Lighthouse application
        uses: actions/checkout@v4
        with:
          repository: ggrabka/WebdevLighthouseProject
          path: WebdevLighthouseProject
      - name: Verify Android project
        run: |
          ls -la WebdevLighthouseProject/CommunityHub/frontend/android
          test -f WebdevLighthouseProject/CommunityHub/frontend/android/gradlew
      - name: JDK 17 setup
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Capacitor dependencies
        working-directory: WebdevLighthouseProject/CommunityHub/frontend
        run: npm ci
      - name: Synchronize Capacitor Android
        working-directory: WebdevLighthouseProject/CommunityHub/frontend
        run: npx cap sync android
      - name: Inspect Capacitor project
        run: |
          ls -la WebdevLighthouseProject/CommunityHub/frontend
          ls -la WebdevLighthouseProject/CommunityHub/frontend/android
          find WebdevLighthouseProject/CommunityHub/frontend -maxdepth 2 -name "capacitor.config.*"
      - name: Build Capacitor debug APK
        working-directory: WebdevLighthouseProject/CommunityHub/frontend/android
        run: bash ./gradlew assembleDebug
      - name: Verify debug APK
        run: |
          ls -lh WebdevLighthouseProject/CommunityHub/frontend/android/app/build/outputs/apk/debug/
          test -f WebdevLighthouseProject/CommunityHub/frontend/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Install Appium Server 3
        run: |
          npm install -g appium@3
          appium --version
      - name: Install UiAutomator2 driver
        run: |
          appium driver install uiautomator2
          appium driver list --installed
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb devices
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
      - name: Compile Appium tests
        working-directory: mobile-tests
        run: mvn -B test-compile