name: Appium CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  appium-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: checkOut Appium repository
        uses: actions/checkout@v4

      - name: JDK 17 setup
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile Appium tests
        working-directory: CommunityHub
        run: mvn -B test-compile